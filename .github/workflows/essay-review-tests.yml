name: Essay review API tests

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "api/essay-review.js"
      - "tests/essay-review.test.cjs"
      - ".github/workflows/essay-review-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/essay-review.js"
      - "tests/essay-review.test.cjs"
      - ".github/workflows/essay-review-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test malformed chat payloads
        run: node --test tests/essay-review.test.cjs
