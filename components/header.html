<!-- TOP BRANDING HEADER BAR -->
  <header class="bg-batik-header text-white shadow-lg relative overflow-hidden px-4 py-4 md:py-6">
    <div class="absolute top-0 left-0 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl -translate-x-10 -translate-y-10"></div>
    <div class="absolute top-2 left-10 text-amber-300/40 animate-pulse text-lg">✦</div>
    <div class="absolute bottom-2 right-12 text-amber-300/30 text-xl">✦</div>
    
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 relative z-10">
      <!-- Logo & Nama Platform -->
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-br from-amber-200 to-amber-500 text-[#3f2314] p-2.5 rounded-2xl shadow-inner border border-amber-300 font-extrabold text-2xl tracking-wider font-title flex items-center justify-center">
          <i class="fa-solid fa-graduation-cap mr-1"></i>NEP
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-black font-title tracking-wide uppercase text-amber-50">Nulis Esai by Parthoo</h1>
          <p class="text-xs text-amber-200/80 font-semibold tracking-wide">AI Essay Coach • Latihan, Evaluasi, dan Progres</p>
        </div>
      </div>

      <!-- Mode & Status Indicator -->
      <div class="flex items-center gap-3">
        <span id="role-badge" class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-2">
          <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span>
          Mode Ujian Aktif
        </span>

        <button onclick="toggleAdminMode()" id="btn-toggle-mode" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white px-4 py-1.5 rounded-xl text-sm font-semibold flex items-center gap-2 transition-all">
          <i class="fa-solid fa-user-gear"></i>
          <span>Masuk Admin</span>
        </button>
      </div>
    </div>
  </header>
