<!-- FLOATING MASCOT COMPANION ("MIKO") -->
  <!-- ============================================== -->
  <div id="mascot-container" class="fixed bottom-6 right-6 z-40 flex flex-col items-end gap-2 max-w-[280px] sm:max-w-xs pointer-events-none select-none">
    
    <!-- Bubble Chat -->
    <div id="mascot-speech" class="bg-white text-slate-800 border border-slate-200 p-3.5 rounded-2xl shadow-xl text-xs font-semibold leading-relaxed relative opacity-0 translate-y-2 pointer-events-auto transition-all duration-300">
      <div class="absolute bottom-[-6px] right-8 w-3 h-3 bg-white border-r border-b border-slate-200 transform rotate-45"></div>
      <p id="mascot-speech-text">Sugeng rawuh! Pilih paket belajarmu di atas ya.</p>
    </div>

    <!-- Companion Main Body -->
    <div class="flex items-center gap-2 pointer-events-auto">
      
      <!-- Mascot Toggle Button (Minimize) -->
      <button onclick="toggleMascotVisibility()" class="bg-slate-950/80 hover:bg-slate-950 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs shadow-md transition-all">
        <i id="mascot-toggle-icon" class="fa-solid fa-eye-slash"></i>
      </button>

      <!-- Active Mascot Body Wrapper -->
      <div onclick="speakMascotQuote()" class="relative cursor-pointer group flex flex-col items-center">
        <!-- Breathing Sprite with 1000958558.png -->
        <div id="mascot-avatar" class="mascot-sprite w-24 h-24 sm:w-28 sm:h-28 rounded-full mascot-anim-float"></div>
        <!-- Shadow element -->
        <div class="w-14 h-2.5 bg-slate-950/20 rounded-full animate-mascot-shadow mt-1 filter blur-[1px]"></div>
      </div>

    </div>
  </div>

  <!-- ============================================== -->
