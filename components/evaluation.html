<!-- 4. MODE EVALUASI / LAPORAN HASIL (DIREKTORAT) -->
    <!-- ============================================== -->
    <section id="section-evaluation" class="hidden space-y-6 animate-fadeIn">
      
      <!-- Kartu Ringkasan Hasil Utama -->
      <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="bg-gradient-to-br from-slate-900 to-[#3e2413] text-white p-6 md:p-8 relative">
          <!-- Dekorasi Latar Belakang -->
          <div class="absolute inset-0 bg-grid-white/[0.05] bg-[size:20px_20px]"></div>
          
          <div class="relative z-10 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="space-y-2 text-center md:text-left">
              <span id="eval-pkg-badge" class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3.5 py-1 rounded-full text-xs font-semibold uppercase tracking-widest font-title">
                Lembar Hasil Evaluasi Paket --
              </span>
              <h2 class="text-2xl md:text-3xl font-black font-title">Analisis Koreksi Nulis Esai by Parthoo</h2>
              <p class="text-sm text-slate-300 max-w-xl font-medium">Jawaban esai Anda dievaluasi secara cerdas menggunakan kriteria seleksi masuk Universitas Diponegoro.</p>
            </div>
            
            <!-- Lingkaran Skor Rata-rata -->
            <div class="bg-white/5 border border-white/10 rounded-2xl p-4 md:p-6 text-center flex flex-col items-center justify-center backdrop-blur-sm min-w-[180px]">
              <span class="text-xs font-bold text-amber-300 uppercase tracking-widest mb-1">Skor Diperoleh</span>
              <div id="average-score-val" class="text-5xl font-extrabold font-title text-amber-400">0</div>
              <span class="text-[10px] text-slate-400 mt-1.5 uppercase tracking-wider animate-pulse" id="grade-label">Sedang Memproses...</span>
            </div>
          </div>
        </div>

        <div class="p-4 md:p-6 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
          <div class="text-xs text-slate-500 font-medium">
            <span class="mr-4"><i class="fa-solid fa-calendar mr-1.5"></i> Tanggal: <strong id="eval-date-str" class="text-slate-700">--</strong></span>
            <span><i class="fa-solid fa-user mr-1.5"></i> ID Peserta: <strong id="eval-user-id" class="text-slate-700">--</strong></span>
          </div>
          <div class="flex gap-2" id="eval-buttons">
            <button onclick="window.print()" class="bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 text-xs px-4 py-2 rounded-xl font-bold flex items-center gap-2 transition">
              <i class="fa-solid fa-print"></i> Cetak PDF
            </button>
            <button onclick="exitToPackageSelector()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-4 py-2 rounded-xl font-bold flex items-center gap-2 transition shadow-md">
              <i class="fa-solid fa-arrow-left"></i> Selesai & Pilih Paket Lain
            </button>
          </div>
        </div>
      </div>

      <!-- Detail Koreksi per Soal -->
      <h3 class="font-bold text-lg text-slate-800 font-title flex items-center gap-2 mt-4">
        <i class="fa-solid fa-magnifying-glass-chart text-blue-600"></i> Koreksi & Ulasan Detail Paket
      </h3>

      <div id="evaluation-details-container" class="space-y-6">
        <!-- Rincian evaluasi di-render di sini -->
      </div>
    </section>
